<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Changuito Coto</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --verde: #00873a;
      --rojo: #e02424;
      --coto-rojo: #d32f2f;
      --fondo: #f4f5f7;
      --card: #ffffff;
      --texto: #1c1e21;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px; background: var(--fondo); color: var(--texto); }
    .card { background: var(--card); padding: 14px; border-radius: 12px; margin-top: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    
    /* Encabezado con marca y autor */
    .header-coto { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 10px 6px; }
    .logo-container { display: flex; align-items: baseline; gap: 8px; }
    .coto-badge { background: var(--coto-rojo); color: white; font-size: 20px; font-weight: 900; letter-spacing: 2px; padding: 2px 8px; border-radius: 6px; }
    .firma-kevin { font-size: 11px; font-weight: 600; color: #777; font-style: italic; }

    #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; position: relative; }
    .btn-torch { position: absolute; bottom: 10px; right: 10px; z-index: 10; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.4); border-radius: 50%; width: 42px; height: 42px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 11px; text-transform: uppercase; }
    .verde-badge { background: #e6f7ec; color: var(--verde); border: 1px solid #a3e6b9; }
    .rojo-badge { background: #fde8e8; color: var(--rojo); border: 1px solid #f8b4b4; }

    /* Barra de reintegro */
    .tope-box { margin-top: 8px; font-size: 12px; color: #555; }
    .progress-bar-bg { width: 100%; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; background: var(--verde); width: 0%; transition: width 0.3s ease; }

    /* Controles de changuito */
    .item-fila { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 13px; }
    .item-info { flex: 1; margin-right: 8px; }
    .item-controles { display: flex; align-items: center; gap: 6px; }
    .btn-qty { background: #e5e7eb; border: none; border-radius: 4px; width: 26px; height: 26px; font-weight: bold; font-size: 14px; cursor: pointer; }
    .btn-borrar { background: #fee2e2; color: var(--rojo); border: none; border-radius: 4px; width: 26px; height: 26px; font-weight: bold; cursor: pointer; }
    .btn-add { width: 100%; background: var(--verde); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 10px; cursor: pointer; }
    .btn-search { background: #1976d2; color: white; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .resumen { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; }
    .total-final { font-size: 18px; font-weight: bold; color: #111; border-top: 1px dashed #ccc; padding-top: 8px; margin-top: 8px; }
    select, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
    .manual-box { background: #fffbe6; border: 1px solid #ffe58f; padding: 12px; border-radius: 8px; margin-top: 10px; }
    .resultados-busqueda { max-height: 180px; overflow-y: auto; margin-top: 8px; border: 1px solid #ddd; border-radius: 6px; background: #fff; }
    .opcion-prod { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <!-- Encabezado con Logo y Firma -->
  <div class="header-coto">
    <div class="logo-container">
      <span class="coto-badge">COTO</span>
    </div>
    <span class="firma-kevin">Una creación de Kevin</span>
  </div>

  <!-- Selector de Beneficio Bancario -->
  <div class="card" style="margin-top: 0;">
    <label style="font-size: 11px; font-weight: bold; color: #666; display: block; margin-bottom: 4px;">PROMO DEL DÍA Y TOPE DE REINTEGRO:</label>
    <select id="select-promo" onchange="cambiarPromo()">
      <option value="0.30" data-tope="15000">Jueves: 30% Visa Débito NFC</option>
      <option value="0.20" data-tope="10000">Finde: 20% Mercado Pago</option>
      <option value="0.25" data-tope="12000">Viernes: 25% Mercado Pago</option>
      <option value="0.00" data-tope="0">Sin Promo (Precio Góndola)</option>
    </select>

    <div class="tope-box" id="caja-tope">
      <div style="display: flex; justify-content: space-between;">
        <span>Ahorro aplicado: <b id="ahorro-acumulado">$0</b></span>
        <span>Tope: <b id="tope-maximo">$15.000</b></span>
      </div>
      <div class="progress-bar-bg">
        <div id="tope-barra" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Escáner de Cámara con Flash -->
  <div style="position: relative; margin-top: 12px;">
    <div id="reader"></div>
    <button class="btn-torch" id="btn-flash" onclick="toggleFlash()">🔦</button>
  </div>

  <!-- Buscador Manual por Código EAN (Última Opción) -->
  <div class="card" style="padding: 10px 14px;">
    <label style="font-size: 11px; font-weight: bold; color: #666; display: block; margin-bottom: 6px;">¿NO LEE EL CÓDIGO? BUSCAR POR EAN (13 DÍGITOS):</label>
    <div style="display: flex; gap: 8px;">
      <input type="number" id="input-ean-directo" placeholder="Ej: 7790580146115" inputmode="numeric">
      <button class="btn-search" onclick="buscarPorEanDirecto()">Buscar</button>
    </div>
  </div>

  <!-- Detalle del Producto Detectado -->
  <div class="card" id="scan-result" style="display: none;">
    <span id="badge" class="status-badge"></span>
    <h3 id="prod-nombre" style="margin: 8px 0 4px 0; font-size: 16px;"></h3>
    <div style="font-size: 13px; color: #666;">Precio Góndola: <b id="prod-precio-orig"></b></div>
    <div style="font-size: 15px; color: #111; margin-top: 2px;">Precio c/ Descuento: <b id="prod-precio-promo" style="color:var(--verde);"></b></div>
    
    <div id="manual-fallback" class="manual-box" style="display: none;">
      <small style="color: #873800; font-weight: bold; display: block; margin-bottom: 6px;">
        Código no indexado. Buscalo por nombre para asociar su precio:
      </small>
      <input type="text" id="input-busqueda" placeholder="Ej: pure tomate, arcor..." oninput="filtrarProductos()">
      <div id="lista-resultados" class="resultados-busqueda" style="display: none;"></div>
    </div>

    <button class="btn-add" id="btn-agregar">Agregar al Changuito</button>
  </div>

  <!-- Carrito Acumulado -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 style="margin: 0; font-size: 16px;">Mi Changuito</h3>
      <button onclick="vaciarChanguito()" style="background: none; border: none; color: #888; font-size: 12px; cursor: pointer; text-decoration: underline;">Vaciar todo</button>
    </div>

    <div class="resumen" style="margin-top: 10px;"><span>Subtotal Góndola:</span><span id="subtotal-gondola">$0,00</span></div>
    <div class="resumen" style="color: var(--verde);"><span>Ahorro efectivo:</span><span id="total-ahorro">-$0,00</span></div>
    <div class="resumen total-final"><span>Total a pagar:</span><span id="total-pagar">$0,00</span></div>
    
    <div id="lista-changuito" style="margin-top: 12px;"></div>
  </div>

  <script>
    let catalogo = [];
    let changuito = JSON.parse(localStorage.getItem('changuito_items') || '[]');
    let mapaMemoria = JSON.parse(localStorage.getItem('changuito_ean_map') || '{}');
    let ultimoEscaneado = null;
    let html5QrCode = null;
    let flashEncendido = false;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.08);
      if (navigator.vibrate) navigator.vibrate(60);
    }

    fetch('productos.json')
      .then(r => r.json())
      .then(data => {
        catalogo = data;
        actualizarTotales();
      })
      .catch(err => console.error("Error al cargar productos.json:", err));

    function normalizar(str) {
      return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function cambiarPromo() {
      actualizarTotales();
      if (ultimoEscaneado) {
        mostrarProducto(ultimoEscaneado.nombre, ultimoEscaneado.precioLista, ultimoEscaneado.excluido, ultimoEscaneado.codigo);
      }
    }

    function mostrarProducto(nombre, precio, esExcluido, codigo) {
      const select = document.getElementById('select-promo');
      const descPorc = parseFloat(select.value);
      const aplica = !esExcluido && descPorc > 0;
      const precioFinal = aplica ? precio * (1 - descPorc) : precio;

      ultimoEscaneado = {
        codigo: codigo,
        nombre: nombre,
        precioLista: precio,
        precioFinal: precioFinal,
        excluido: esExcluido,
        aplicaPromo: aplica
      };

      document.getElementById('scan-result').style.display = 'block';
      document.getElementById('prod-nombre').innerText = nombre;
      document.getElementById('prod-precio-orig').innerText = `$${precio.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
      document.getElementById('prod-precio-promo').innerText = `$${precioFinal.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;

      const badge = document.getElementById('badge');
      if (aplica) {
        badge.className = 'status-badge verde-badge';
        badge.innerText = `APLICA ${(descPorc * 100).toFixed(0)}% OFF`;
      } else {
        badge.className = 'status-badge rojo-badge';
        badge.innerText = 'EXCLUIDO DE LA PROMO';
      }
    }

    function onScanSuccess(codigoLeido) {
      beep();
      procesarCodigo(codigoLeido);
    }

    function buscarPorEanDirecto() {
      const input = document.getElementById('input-ean-directo').value.trim();
      if (!input) {
        alert("Ingresá un código EAN numérico.");
        return;
      }
      beep();
      procesarCodigo(input);
      document.getElementById('input-ean-directo').value = '';
    }

    function procesarCodigo(codigoLeido) {
      // 1. Memoria persistente previa
      if (mapaMemoria[codigoLeido]) {
        const p = mapaMemoria[codigoLeido];
        document.getElementById('manual-fallback').style.display = 'none';
        mostrarProducto(p.nombre, p.precio, p.excluido, codigoLeido);
        return;
      }

      // 2. Coincidencia por EAN, código o balanza
      let candidatos = [codigoLeido];
      if (codigoLeido.startsWith('28') || codigoLeido.startsWith('20')) {
        candidatos.push(codigoLeido.substring(2, 9), String(parseInt(codigoLeido.substring(2, 9), 10)));
      }

      const p = catalogo.find(item => 
        candidatos.includes(item.codigo) || 
        (item.ean && candidatos.includes(item.ean))
      );

      if (p) {
        document.getElementById('manual-fallback').style.display = 'none';
        mostrarProducto(p.nombre, p.precio, p.excluido, codigoLeido);
      } else {
        document.getElementById('manual-fallback').style.display = 'block';
        document.getElementById('input-busqueda').value = '';
        document.getElementById('lista-resultados').style.display = 'none';
        mostrarProducto("Código: " + codigoLeido, 0.0, true, codigoLeido);
      }
    }

    function filtrarProductos() {
      const txt = normalizar(document.getElementById('input-busqueda').value.trim());
      const cont = document.getElementById('lista-resultados');
      if (txt.length < 2) { cont.style.display = 'none'; return; }

      const palabras = txt.split(/\s+/);
      const matches = catalogo.filter(item => {
        const nom = normalizar(item.nombre);
        return palabras.every(p => nom.includes(p));
      }).slice(0, 15);

      if (matches.length === 0) {
        cont.innerHTML = '<div style="padding:8px; font-size:12px; color:#888;">No hay coincidencias.</div>';
        cont.style.display = 'block';
        return;
      }

      cont.innerHTML = matches.map(item => `
        <div class="opcion-prod" onclick="vincularSeleccionado(${catalogo.indexOf(item)})">
          <span>${item.nombre}</span>
          <b>$${item.precio.toLocaleString('es-AR', {minimumFractionDigits: 2})}</b>
        </div>
      `).join('');
      cont.style.display = 'block';
    }

    function vincularSeleccionado(idx) {
      const p = catalogo[idx];
      mapaMemoria[ultimoEscaneado.codigo] = {
        nombre: p.nombre,
        precio: p.precio,
        excluido: p.excluido
      };
      localStorage.setItem('changuito_ean_map', JSON.stringify(mapaMemoria));
      mostrarProducto(p.nombre, p.precio, p.excluido, ultimoEscaneado.codigo);
      document.getElementById('manual-fallback').style.display = 'none';
    }

    document.getElementById('btn-agregar').addEventListener('click', () => {
      if (!ultimoEscaneado || ultimoEscaneado.precioLista <= 0) {
        alert("Asociá el precio del artículo antes de sumarlo.");
        return;
      }
      
      const existente = changuito.find(i => i.codigo === ultimoEscaneado.codigo);
      if (existente) {
        existente.cantidad += 1;
      } else {
        changuito.push({ ...ultimoEscaneado, cantidad: 1 });
      }

      guardarChanguito();
      document.getElementById('scan-result').style.display = 'none';
      ultimoEscaneado = null;
    });

    function cambiarCantidad(idx, delta) {
      changuito[idx].cantidad += delta;
      if (changuito[idx].cantidad <= 0) {
        changuito.splice(idx, 1);
      }
      guardarChanguito();
    }

    function borrarItem(idx) {
      changuito.splice(idx, 1);
      guardarChanguito();
    }

    function vaciarChanguito() {
      if (confirm("¿Vaciar todo el changuito?")) {
        changuito = [];
        guardarChanguito();
      }
    }

    function guardarChanguito() {
      localStorage.setItem('changuito_items', JSON.stringify(changuito));
      actualizarTotales();
    }

    function actualizarTotales() {
      const select = document.getElementById('select-promo');
      const descPorc = parseFloat(select.value);
      const topeMax = parseFloat(select.selectedOptions[0].dataset.tope || 0);

      let subtotalGondola = 0;
      let ahorroTeorico = 0;

      changuito.forEach(item => {
        const itemTotal = item.precioLista * item.cantidad;
        subtotalGondola += itemTotal;
        if (item.aplicaPromo && descPorc > 0) {
          ahorroTeorico += itemTotal * descPorc;
        }
      });

      const ahorroReal = topeMax > 0 ? Math.min(ahorroTeorico, topeMax) : ahorroTeorico;
      const totalPagar = subtotalGondola - ahorroReal;

      if (topeMax > 0) {
        document.getElementById('caja-tope').style.display = 'block';
        document.getElementById('ahorro-acumulado').innerText = `$${ahorroReal.toLocaleString('es-AR', {minimumFractionDigits: 0})}`;
        document.getElementById('tope-maximo').innerText = `$${topeMax.toLocaleString('es-AR', {minimumFractionDigits: 0})}`;
        const pct = Math.min((ahorroReal / topeMax) * 100, 100);
        const barra = document.getElementById('tope-barra');
        barra.style.width = pct + '%';
        barra.style.background = pct >= 100 ? 'var(--rojo)' : 'var(--verde)';
      } else {
        document.getElementById('caja-tope').style.display = 'none';
      }

      document.getElementById('subtotal-gondola').innerText = `$${subtotalGondola.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
      document.getElementById('total-ahorro').innerText = `-$${ahorroReal.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
      document.getElementById('total-pagar').innerText = `$${totalPagar.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;

      const contenedor = document.getElementById('lista-changuito');
      if (changuito.length === 0) {
        contenedor.innerHTML = '<small style="color: #999;">El changuito está vacío.</small>';
        return;
      }

      contenedor.innerHTML = changuito.map((i, idx) => `
        <div class="item-fila">
          <div class="item-info">
            <div><b>${i.nombre}</b></div>
            <small style="color:${i.aplicaPromo && descPorc > 0 ? 'var(--verde)' : 'var(--rojo)'}">
              $${i.precioLista.toFixed(2)} c/u ${i.aplicaPromo && descPorc > 0 ? '(Aplica descuento)' : '(Sin descuento)'}
            </small>
          </div>
          <div class="item-controles">
            <button class="btn-qty" onclick="cambiarCantidad(${idx}, -1)">-</button>
            <span><b>${i.cantidad}</b></span>
            <button class="btn-qty" onclick="cambiarCantidad(${idx}, 1)">+</button>
            <button class="btn-borrar" onclick="borrarItem(${idx})">×</button>
          </div>
        </div>
      `).join('');
    }

    async function toggleFlash() {
      try {
        flashEncendido = !flashEncendido;
        await html5QrCode.applyVideoConstraints({
          advanced: [{ torch: flashEncendido }]
        });
      } catch(e) {
        alert("Flash no disponible en este dispositivo.");
      }
    }

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 12, qrbox: { width: 250, height: 140 } },
      onScanSuccess
    ).catch(err => console.error("Error al encender cámara:", err));
  </script>
</body>
</html>
